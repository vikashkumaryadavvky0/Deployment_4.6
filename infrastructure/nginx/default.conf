server {
    listen 80;
    server_name localhost hiregen.local;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Module 4.6 Verification Endpoint
    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","module":"4.6-Deployment","service":"nginx-proxy"}';
    }

    # Gateway Landing Route (Prevents Nginx crash when Frontend container is offline)
    location / {
        default_type text/plain;
        return 200 'HireGen AI Nginx Proxy Gateway is Active!';
    }

    # API Route Placeholder (Prevents Nginx crash when Backend container is offline)
    location /api/v1/ {
        default_type application/json;
        return 200 '{"status":"UP","message":"API Gateway Route Ready"}';
    }
}